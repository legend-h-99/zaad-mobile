name: Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
        env:
          EXPO_PUBLIC_API_URL: https://api.synthetic.test
          EXPO_PUBLIC_SUPABASE_URL: https://db.synthetic.test
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-not-a-secret
      - run: npm audit --omit=dev --audit-level=high
